---
# Without a name, the project is named after this folder, "devcontainer",
# and every project made from this template would share one set of volumes.
name: litellm-opencode-devcontainer-template

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}

    volumes:
      - ..:/app

      # The venv lives in a volume, apart from the host's files. The caches
      # survive a rebuild.
      - venv:/app/.venv
      - uv-cache:/home/developer/.cache/uv
      - precommit-cache:/home/developer/.cache/pre-commit
      - gh-config:/home/developer/.config/gh

    working_dir: /app
    init: true

    # A bare name passes a variable only when it is set. An empty
    # GIT_AUTHOR_NAME fails every commit, and an empty GIT_AUTHOR_EMAIL records
    # a blank author email.
    environment:
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - ANTHROPIC_API_KEY
      - DEEPSEEK_API_KEY
      - GH_CONFIG_DIR=/home/developer/.config/gh
      - UV_CACHE_DIR=/home/developer/.cache/uv
      - PRE_COMMIT_HOME=/home/developer/.cache/pre-commit
      # package = false in pyproject.toml keeps src/ off sys.path.
      - PYTHONPATH=/app/src

    healthcheck:
      # The Dockerfile creates /app/.venv, so test for the interpreter.
      test: ["CMD", "test", "-x", "/app/.venv/bin/python"]
      interval: 30s
      timeout: 5s
      retries: 3
      # A cold uv sync can take over two minutes.
      start_period: 180s

volumes:
  venv:
  uv-cache:
  precommit-cache:
  gh-config:
