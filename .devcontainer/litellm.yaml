# To add a model, add an entry here and the same model_name, with its
# limits, under provider.litellm.models in opencode.json. Put its key in
# .env, and the key's variable name in compose.yaml. Model IDs are listed
# in LiteLLM's model map:
# https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json
model_list:
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
  # Keep "claude" in Claude model names. OpenCode adds prompt-cache markers
  # only when the name has "claude" or "anthropic" in it.
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

router_settings:
  fallbacks:
    - deepseek-v4-pro: [claude-opus]
    - claude-opus: [deepseek-v4-pro]
    - claude-sonnet: [deepseek-flash]
    - deepseek-flash: [claude-sonnet]
