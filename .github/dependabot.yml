---
version: 2

# Without a set prefix, Dependabot may write "Bump x from 1 to 2", which the
# Commit messages check rejects. The "chore" prefix passes and does not cut a
# release. The cooldown gives a bad release a week to be pulled, and zizmor
# checks that it is set.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    # Minor and major Python bumps are done by hand. A patch PR should also
    # bump the other Python pins, which Dependabot does not touch.
    # CONTRIBUTING.md lists them.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-patch-versions:
        applies-to: version-updates
        update-types:
          - "patch"
