---
name: Validate

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit (all hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history secret scan needs every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          # After a hook update, the old cache is still mostly valid.
          restore-keys: |
            pre-commit-

      # The local ruff and mypy hooks call `uv run`.
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # zizmor runs in the next step, so only it gets the token.
      - name: Run all pre-commit hooks
        env:
          SKIP: zizmor
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # The read-only token lets zizmor check that each pinned SHA is a real
      # commit of the action it names.
      - name: Check the workflows for security problems
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run pre-commit run zizmor --all-files

      # The gitleaks commit hook scans only staged changes. CI stages nothing.
      - name: Scan the whole history for secrets
        run: uv run pre-commit run gitleaks-history --hook-stage manual

  test:
    name: Run tests
    needs: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv reads the Python version from .python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run pytest -v

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  # Only a commit that passed every hook and test gets released.
  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # actionlint rejects the form zizmor suggests for this local call, and a
    # job-level call never reads files checked out at runtime.
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]

  # This is kept apart from `test`, so the test code never runs with write
  # access. CONTRIBUTING.md says how to drop it. It waits for `release` so its
  # commit lands on top, and `!cancelled()` lets it run when the release fails
  # or is skipped.
  badge:
    name: Update coverage badge
    needs: [test, release]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    # Shared with the release job, so the two never push to main at once.
    concurrency:
      group: main-writes
      cancel-in-progress: false

    steps:
      # The token stays, since the last step pushes with it. Nothing here
      # uploads the checkout.
      - name: Check out repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # genbadge writes no final newline, which end-of-file-fixer rejects.
      - name: Regenerate the coverage badge
        run: |
          uv run genbadge coverage -i coverage.xml -o badges/coverage.svg
          printf '\n' >> badges/coverage.svg

      - name: Commit the badge if it changed
        run: |
          if git diff --quiet -- badges/coverage.svg; then
            echo "Coverage badge unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
