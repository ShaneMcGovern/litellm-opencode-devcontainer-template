---
name: Commit messages

# The commit-msg hook only runs on the machine that makes a commit, so a
# commit made on the GitHub website skips it. A squash merge puts every
# branch message and the pull request title into the commit on main, where a
# stray "BREAKING CHANGE:" line forces a major release, so all of them are
# checked here. This is its own workflow so that editing the title does not
# rerun the tests.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commit-messages:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The loop below needs the branch history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # `pre-commit run --all-files` in validate.yml skips the commit-msg
      # stage, so each message goes through that stage here.
      - name: Check each non-merge commit message on the branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while read -r sha; do
            git log -1 --format='%B' "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            if ! uv run pre-commit run --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/commit-msg.txt"; then
              echo "::error::commit $sha is not a Conventional Commit"
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit "$status"

      # The title goes through `env`, so it cannot inject shell commands.
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          if ! uv run pre-commit run --hook-stage commit-msg \
            --commit-msg-filename "$RUNNER_TEMP/pr-title.txt"; then
            echo "::error::the pull request title is not a Conventional Commit"
            exit 1
          fi
