---
name: Commit messages

# The commit-msg hook only runs on the machine that makes a commit, so a commit
# made anywhere else, such as on the GitHub website, is checked here instead.
# Every commit message on the branch counts, except merge commits. A squash
# merge copies them all into the commit on main, and a stray "BREAKING CHANGE:"
# line there forces a major release. A merge or rebase merge lands them as they
# are. A squash merge also uses the pull request title as the subject, so the
# title is checked too.
#
# This is its own workflow because of `edited`. That event reruns it after a
# title change, and it should not rerun the hooks and tests too.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commit-messages:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The loop below needs the base commit and the branch history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # `pre-commit run --all-files` skips the commit-msg stage, because it
      # needs one message at a time. So each message goes through that stage
      # here, exactly as the hook would check it on a commit.
      - name: Check each non-merge commit message on the branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while read -r sha; do
            git log -1 --format='%B' "$sha" > "$RUNNER_TEMP/commit-msg.txt"
            if ! uv run pre-commit run --hook-stage commit-msg \
              --commit-msg-filename "$RUNNER_TEMP/commit-msg.txt"; then
              echo "::error::commit $sha is not a Conventional Commit"
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit "$status"

      # The title arrives through `env`, never written into the script itself,
      # so a title cannot inject shell commands.
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          if ! uv run pre-commit run --hook-stage commit-msg \
            --commit-msg-filename "$RUNNER_TEMP/pr-title.txt"; then
            echo "::error::the pull request title is not a Conventional Commit"
            exit 1
          fi
