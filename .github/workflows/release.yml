---
name: Release

# validate.yml calls this after the hooks and tests pass. A push trigger
# would run alongside validate.yml and could release a commit that failed them.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # validate.yml must grant these too, since a called workflow can't widen
    # its caller's permissions.
    permissions:
      contents: write
      issues: write
      pull-requests: write

    # Shared with the badge job in validate.yml.
    concurrency:
      group: main-writes
      cancel-in-progress: false

    steps:
      # The token stays, since semantic-release pushes the release with it.
      # No later step uploads the checkout.
      - name: Check out repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # python-semantic-release needs every commit and tag.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # This runs python-semantic-release with uvx, not its Docker action,
      # which installs pre-release dependencies that cannot be pinned.
      - name: Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.6.2 semantic-release -v version
