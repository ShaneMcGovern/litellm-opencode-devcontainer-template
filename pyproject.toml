[project]
name = "litellm-opencode-devcontainer-template"
version = "0.3.0"
description = "A dev container for the OpenCode coding agent, with a local LiteLLM proxy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shane McGovern", email = "shanemcgovern@protonmail.com" }]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/ShaneMcGovern/litellm-opencode-devcontainer-template"

# With package = false, uv never installs the project, so there is no
# [build-system]. pytest's pythonpath and PYTHONPATH in compose.yaml put
# src/ on sys.path.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "genbadge[coverage]>=1.1.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.4",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov --cov-report=xml --cov-report=term"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 88
# target-version is unset so ruff reads it from requires-python.

[tool.ruff.lint]
# EXE is left out because a Windows bind mount shows every file as executable.
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "SIM",
    "PTH",
    "ARG",
    "TID",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
# python_version is unset so mypy uses the interpreter uv picks from
# .python-version.

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# This is not a build. It re-locks so uv.lock gets the new version, and
# assets adds it to the release commit. If either is missing, the uv-lock
# hook fails on the next push. To publish to PyPI, add a [build-system] and
# make this "uv lock && uv build".
build_command = "uv lock"
assets = ["uv.lock"]
commit_parser = "conventional"
# Set this false and the next release jumps to 1.0.0.
allow_zero_version = true
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"
