---
default_install_hook_types: [pre-commit, commit-msg]

# Otherwise a hook with no `stages` also runs on the commit message.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # CI stages nothing, so it runs the second entry to scan the whole history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (whole history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  # pre-commit/mirrors-prettier is archived. This fork is kept up to date.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, json]
        # Copier writes single quotes in .copier-answers.yml, so prettier
        # would fight each `copier update`.
        exclude: ^(\.devcontainer/devcontainer\.json|\.copier-answers\.yml)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # actionlint shellchecks `run:` blocks only where shellcheck is on its PATH,
  # which is true in CI but not in the dev container.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor

  - repo: https://github.com/reteps/dockerfmt
    rev: v0.6.0
    hooks:
      - id: dockerfmt
        args: [--indent=4, --newline, --write]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  # GitHub reports a broken dependabot.yml only after it lands on main.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-dependabot

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
        exclude: ^CHANGELOG\.md$

  # CI's `uv sync --frozen` never checks that uv.lock matches pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.10
    hooks:
      - id: uv-lock

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
